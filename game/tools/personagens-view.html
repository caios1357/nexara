<!doctype html><html><head><meta charset="utf-8"><title>NEXARA — 9 personagens (visualizador de teste)</title>
<style>html,body{margin:0;background:#111;overflow:hidden;font:12px sans-serif;color:#ddd}#lb{position:fixed;left:0;right:0;bottom:4px;display:flex;justify-content:space-around;pointer-events:none;font-weight:700}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="lb"></div>
<script type="module">
import * as THREE from 'three';
import { createHeroModel } from '../js/fps/hero-model.js?v=20261023tuto';
import { kitFor } from '../js/fps/hero-kit.js?v=20261023tuto';
import { PERSONAGENS } from '../js/personagens.js?v=20261023tuto';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || PERSONAGENS.map((p) => p.id).join(',')).split(',');
const skin = q.get('skin') || '';
const yaw = +(q.get('yaw') || 0.35);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1d2230);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a3020, 1.3)); const sun = new THREE.DirectionalLight(0xfff1dd, 2.4); sun.position.set(3, 8, 7); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 32), new THREE.MeshStandardMaterial({ color: 0x3a4032, roughness: 0.95 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const cols = Math.min(ids.length, +(q.get('cols') || 9)); const sp = 1.25;
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 100);
const W = (cols - 1) * sp; cam.position.set(0, 1.35, 1.2 + cols * 0.78); cam.lookAt(0, 0.92, 0);
const hs = []; const lb = document.getElementById('lb');
ids.forEach((id, i) => {
  const kit = kitFor({ styleId: id, custom: skin ? { skin } : {} });
  const hm = createHeroModel({ styleId: id, kit, glb: false });

  const s = document.createElement('span'); s.textContent = (PERSONAGENS.find((p) => p.id === id)?.name || id) + (skin ? ' · ' + skin : ''); lb.appendChild(s);
});
let t = 0; function f() { t += 0.016; for (const h of hs) h.update(0.016, { x: 0, z: 0, yaw: Math.PI, speed: 0, walkSpeed: 2.4, runSpeed: 3.4, attack: null, action: null, groundY: 0, leapHeight: 0.9 }); r.render(scene, cam); requestAnimationFrame(f); }
f(); window.__ready = true;
</script></body></html>
