<!doctype html><html><head><meta charset="utf-8"><title>NEXARA — 6 dragões (visualizador de teste)</title>
<style>html,body{margin:0;background:#111;overflow:hidden;font:13px sans-serif;color:#ddd}#lb{position:fixed;left:0;right:0;bottom:4px;display:flex;justify-content:space-around;pointer-events:none;font-weight:700}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="lb"></div>
<script type="module">
import * as THREE from 'three';
import { createBossDragon } from '../js/fps/boss-dragon-view.js?v=20261023pers';
import { DRAGON_ART } from '../js/fps/dragon-art.js?v=20261023pers';
const q = new URLSearchParams(location.search); const yaw = +(q.get('yaw') || 0.6);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3040);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a3020, 1.4)); const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(5, 12, 9); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(80, 32), new THREE.MeshStandardMaterial({ color: 0x3a4032, roughness: 0.95 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const keys = Object.keys(DRAGON_ART); const sp = 6.5; const W = (keys.length - 1) * sp;
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200); cam.position.set(0, 7, 30); cam.lookAt(0, 2.6, 0);
const vs = []; const lb = document.getElementById('lb');
keys.forEach((k, i) => { const pal = { base: DRAGON_ART[k].base, escuro: DRAGON_ART[k].escuro, brilho: DRAGON_ART[k].brilho }; const v = createBossDragon({ height: 5.2, palette: k === 'verde' ? null : pal }); v.root.position.set(-W / 2 + i * sp, 0, 0); v.root.rotation.y = yaw; scene.add(v.root); vs.push(v); const s = document.createElement('span'); s.textContent = k.toUpperCase(); lb.appendChild(s); });
let last = performance.now(); function f(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; for (const v of vs) v.glb?.update?.(dt, { state: 'IDLE', progress: 0, speed: 0, attack: null }); r.render(scene, cam); requestAnimationFrame(f); }
requestAnimationFrame(f); window.__scene = scene; setTimeout(() => { window.__ready = true; }, 4000);
</script></body></html>
